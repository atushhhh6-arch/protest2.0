name: Compare Working Domains

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare DNS and TLS
        shell: bash
        run: |
          set +e
          for d in ayushbirthday.lol gta6war.online protestayush.lol; do
            echo "===== $d ====="
            echo "-- NS"; dig +short NS "$d"
            echo "-- A"; dig +short A "$d"
            echo "-- AAAA"; dig +short AAAA "$d"
            echo "-- CNAME"; dig +short CNAME "$d"
            echo "-- HTTPS"; curl -4 -sSvkI --max-time 20 "https://$d/" 2>&1 | sed -n '1,70p'
            echo "-- TLS"; echo | openssl s_client -connect "$d:443" -servername "$d" 2>&1 | egrep "subject=|issuer=|Verify return code|Protocol|Cipher" | head -n 12
          done
