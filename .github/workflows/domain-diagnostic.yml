name: Domain Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose protestayush.lol
        shell: bash
        run: |
          set +e
          echo "=== NS ==="
          dig +short NS protestayush.lol
          echo "=== A ==="
          dig +short A protestayush.lol
          echo "=== AAAA ==="
          dig +short AAAA protestayush.lol
          echo "=== CNAME root ==="
          dig +short CNAME protestayush.lol
          echo "=== CNAME www ==="
          dig +short CNAME www.protestayush.lol
          echo "=== SOA ==="
          dig +short SOA protestayush.lol
          echo "=== HTTPS headers ==="
          curl -vkI --max-time 20 https://protestayush.lol/ 2>&1
          echo "=== HTTP headers ==="
          curl -vI --max-time 20 http://protestayush.lol/ 2>&1
          echo "=== TLS certificate ==="
          echo | openssl s_client -connect protestayush.lol:443 -servername protestayush.lol -showcerts 2>&1 | sed -n '1,120p'
          echo "=== workers.dev health ==="
          curl -fsS --max-time 20 https://protest2-0.atushhhh6.workers.dev/api/health || true
