name: DataFast Public Probe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Discover DataFast widget routes
        shell: bash
        run: |
          set +e
          base="https://datafa.st"
          page="/widgets/dfid_1YPvnaXAWHHLTYaWUGFMj/recent"
          curl -LsS "$base$page" -o /tmp/page.html
          echo "=== recent page visible text clues ==="
          sed 's/<[^>]*>/\n/g' /tmp/page.html | tr -s '\n' | grep -Ei 'users|visitor|view|page|today|total|recent|country|public|error' | head -n 80
          echo "=== script chunks ==="
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/page.html | sed 's/src="//;s/"$//' | sort -u > /tmp/chunks.txt
          cat /tmp/chunks.txt
          while read -r p; do
            case "$p" in
              http*) u="$p";;
              *) u="$base$p";;
            esac
            curl -LsS "$u" >> /tmp/all.js
            echo >> /tmp/all.js
          done < /tmp/chunks.txt
          echo "=== widget route/name clues from JS ==="
          grep -oE '.{0,120}(widgets/|recent|pageviews|pageViews|visitors|sessions|today|total|unique|countries|referrers).{0,180}' /tmp/all.js | head -n 220
