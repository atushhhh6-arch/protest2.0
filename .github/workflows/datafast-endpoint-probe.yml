name: DataFast Endpoint Probe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Discover public DataFast endpoints
        shell: bash
        run: |
          set +e
          share="https://datafa.st/share/6ac1b7f9dba3b3e23525f59b"
          curl -sS -L "$share" -o /tmp/share.html
          grep -Eo '/_next/static/chunks/[^"]+\.js' /tmp/share.html | sort -u > /tmp/chunks.txt
          echo "chunks $(wc -l < /tmp/chunks.txt)"
          mkdir -p /tmp/chunks
          i=0
          while read -r p; do
            i=$((i+1))
            curl -sS -L "https://datafa.st$p" -o "/tmp/chunks/$i.js"
          done < /tmp/chunks.txt
          echo "=== endpoint-like strings ==="
          grep -rhoE '.{0,180}(/api/[A-Za-z0-9_?&=./{}:-]+|realtime|pageviews|publicDashboard|isPublic|websiteId).{0,260}' /tmp/chunks | grep -Ei 'api|realtime|pageview|public|website' | head -n 240
