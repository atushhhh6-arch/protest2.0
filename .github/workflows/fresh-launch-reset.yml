name: Fresh Launch Readiness Check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Cloudflare and verify fresh production state
        shell: bash
        run: |
          set -u
          BASE="https://protest2-0.atushhhh6.workers.dev"
          for i in $(seq 1 30); do
            HEALTH="$(curl -fsS "$BASE/api/health" 2>/dev/null || true)"
            STATE="$(curl -fsS "$BASE/api/public-state" 2>/dev/null || true)"

            if printf '%s' "$HEALTH" | jq -e '
              .ok == true and
              .database == true and
              .payment_provider == true and
              .payment_environment == "live_mode" and
              .webhook_configured == true and
              .automatic_live_refunds == true and
              .bookings_open == true
            ' >/dev/null 2>&1 &&
            printf '%s' "$STATE" | jq -e '
              .ok == true and
              (.placements | length) == 12 and
              (.activity | length) == 0 and
              ([.placements[] | select(.sponsor != null)] | length) == 0 and
              ([.placements[] | select((.current_amount_cents // 0) != 0)] | length) == 0 and
              .settings.bookings_open == true
            ' >/dev/null 2>&1; then
              echo "LIVE_READY"
              echo "$HEALTH" | jq .
              echo "$STATE" | jq '{placements: (.placements|length), occupied: ([.placements[]|select(.sponsor != null)]|length), activity: (.activity|length), settings}'
              exit 0
            fi

            echo "Attempt $i: production not fully ready yet"
            echo "$HEALTH" | jq . 2>/dev/null || true
            sleep 10
          done

          echo "Production did not become fully ready in time."
          exit 1
