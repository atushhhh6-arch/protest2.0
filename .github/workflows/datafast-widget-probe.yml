name: DataFast Widget Probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect valid DataFast widgets
        shell: bash
        run: |
          set +e
          id="dfid_1YPvnaXAWHHLTYaWUGFMj"
          for slug in recent realtime analytics; do
            echo "=== $slug ==="
            curl -sS -L "https://datafa.st/widgets/$id/$slug" -o "/tmp/$slug"
            echo "--- text clues ---"
            grep -Eo '.{0,80}(Users|Visitors|visitors|Pageviews|pageviews|Revenue|revenue|Online|online|Today|today|Last|last|Public|public).{0,120}' "/tmp/$slug" | head -n 40
            echo "--- urls ---"
            grep -Eo 'https?[^" ]+' "/tmp/$slug" | head -n 20
            echo "--- size ---"
            wc -c "/tmp/$slug"
          done
