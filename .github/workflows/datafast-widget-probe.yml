name: DataFast Widget Probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check DataFast widget embed headers
        shell: bash
        run: |
          set +e
          for u in             "https://datafa.st/widgets/dfid_1YPvnaXAWHHLTYaWUGFMj/analytics"             "https://datafa.st/widgets/dfid_1YPvnaXAWHHLTYaWUGFMj/realtime"             "https://datafa.st/share/6ac1b7f9dba3b3e23525f59b"; do
            echo "=== $u ==="
            curl -sS -I -L "$u" | grep -Ei 'HTTP/|x-frame-options|content-security-policy|frame-ancestors|content-type|cache-control'
          done
