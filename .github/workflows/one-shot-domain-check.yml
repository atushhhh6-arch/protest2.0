name: One-shot domain verification

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify root domain and workers.dev
        shell: bash
        run: |
          set -e
          echo "ROOT"
          curl -fsS --max-time 20 https://protestayush.lol/api/health
          echo
          echo "WORKERS_DEV"
          curl -fsS --max-time 20 https://protest2-0.atushhhh6.workers.dev/api/health
          echo
          echo "NS"
          dig +short NS protestayush.lol
