name: Fetch protest reels

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-protest-reels.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install downloader
        run: python -m pip install --upgrade yt-dlp

      - name: Download reel videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/reels
          rm -f public/reels/protest-{1,2,3,4,5}.mp4

          download () {
            index="$1"
            url="$2"
            tmp="public/reels/.download-$index.%(ext)s"
            yt-dlp --no-playlist --no-warnings               --merge-output-format mp4               --recode-video mp4               -f "bv*+ba/b"               -o "$tmp"               "$url"
            file="$(find public/reels -maxdepth 1 -type f -name ".download-$index.*" | head -n1)"
            test -n "$file"
            mv "$file" "public/reels/protest-$index.mp4"
            test -s "public/reels/protest-$index.mp4"
          }

          download 1 "https://www.instagram.com/reel/Dd_0YtkKeWh/?stkn=eDV4MTk2ZmN4MnZl"
          download 2 "https://www.instagram.com/reel/Dd_1LGmorVJ/?stkn=eXM5ZTllM2Z5YXF3"
          download 3 "https://www.instagram.com/reel/DbJp543TIO6/?stkn=MWk2dDc3YjJic2Nheg=="
          download 4 "https://www.instagram.com/reel/DbYf5iGzwEo/?stkn=MXZ6aGs1NWoyNWNhZA=="
          download 5 "https://www.instagram.com/reel/DeBNkAgNRgz/?stkn=bWN4NzM2MzgxbXI2"

          ls -lh public/reels

      - name: Commit videos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reels/protest-1.mp4 public/reels/protest-2.mp4 public/reels/protest-3.mp4 public/reels/protest-4.mp4 public/reels/protest-5.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Add clean MP4 protest reels"
          git push origin HEAD:main
