name: Deep Domain Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify root and www custom-domain paths
        shell: bash
        run: |
          set +e
          echo "=== ROOT DNS @1.1.1.1 ==="
          dig @1.1.1.1 +short A protestayush.lol || true
          echo "=== WWW DNS @1.1.1.1 ==="
          dig @1.1.1.1 +short A www.protestayush.lol || true
          echo "=== ROOT HTTPS ==="
          curl -sSvkI --max-time 20 https://protestayush.lol/ 2>&1 | sed -n '1,80p' || true
          echo "=== WWW HTTPS ==="
          curl -sSvkI --max-time 20 https://www.protestayush.lol/ 2>&1 | sed -n '1,80p' || true
          echo "=== ROOT HEALTH ==="
          curl -sS --max-time 20 https://protestayush.lol/api/health || true
          echo
          echo "=== WWW HEALTH ==="
          curl -sS --max-time 20 https://www.protestayush.lol/api/health || true
          echo
