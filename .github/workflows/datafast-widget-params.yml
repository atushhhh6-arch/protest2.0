name: DataFast Widget Params Probe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public website-id widget routes
        shell: bash
        run: |
          set +e
          id="6ac1b7f9dba3b3e23525f59b"
          for slug in analytics recent realtime; do
            u="https://datafa.st/widgets/$id/$slug"
            echo "=== $u ==="
            curl -sS -L "$u" -o "/tmp/$slug"
            echo "status/size"; curl -sS -o /dev/null -w "%{http_code} %{size_download}\n" "$u"
            grep -Eo '.{0,180}(Users in Last 30 Minutes|visitors|pageviews|Pageviews|Online|online|Today|today|NaNpx).{0,320}' "/tmp/$slug" | head -n 25
          done
