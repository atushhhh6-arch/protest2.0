name: Verify DataFast Live

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify tracking script on production
        shell: bash
        run: |
          set -e
          echo "=== LIVE PAGE TAG ==="
          curl -fsSL --max-time 20 https://protestayush.lol/ | grep -o 'data-website-id="dfid_1YPvnaXAWHHLTYaWUGFMj"[^>]*src="https://datafa.st/js/script.js"' || true
          echo "=== FULL DATAFAST MATCHES ==="
          curl -fsSL --max-time 20 https://protestayush.lol/ | grep -o 'https://datafa.st/js/script.js' | head
          echo "=== DATAFAST SCRIPT HEADERS ==="
          curl -sSI --max-time 20 https://datafa.st/js/script.js | sed -n '1,25p'
