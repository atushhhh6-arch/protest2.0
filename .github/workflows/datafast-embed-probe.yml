name: DataFast Embed Probe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test public DataFast JSON endpoints
        shell: bash
        run: |
          set +e
          id="6ac1b7f9dba3b3e23525f59b"
          for u in             "https://datafa.st/api/analytics/realtime?websiteId=$id&publicView=1"             "https://datafa.st/api/analytics/realtime/map?websiteId=$id&publicView=1"             "https://datafa.st/api/analytics/main?websiteId=$id&period=30d&isPublic=true&publicView=1"             "https://datafa.st/api/analytics/main?websiteId=$id&period=today&isPublic=true&publicView=1"; do
              echo "=== $u ==="
              curl --max-time 8 -sS -L -w "\nHTTP=%{http_code}\n" "$u" | head -c 3500
              echo
          done
