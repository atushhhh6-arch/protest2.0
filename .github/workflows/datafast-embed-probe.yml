name: DataFast Embed Probe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test DataFast widget size parameters
        shell: bash
        run: |
          set +e
          base="https://datafa.st/widgets/6ac1b7f9dba3b3e23525f59b/realtime"
          for q in "" "?theme=light" "?width=174&height=44" "?w=174&h=44" "?theme=light&width=174&height=44" "?theme=light&w=174&h=44" "?size=174x44" "?theme=light&size=174x44"; do
            echo "=== $q ==="
            curl -sS -L "$base$q" -o /tmp/w
            printf "NaNpx count: "; grep -o "NaNpx" /tmp/w | wc -l
            grep -Eo 'style="font-size:[^"]+"' /tmp/w | head -n 8
          done
