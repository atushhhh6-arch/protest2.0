name: DataFast Embed Probe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Discover widget embed parameter format
        shell: bash
        run: |
          set +e
          curl -sS -L "https://datafa.st/share/6ac1b7f9dba3b3e23525f59b" -o /tmp/share.html
          grep -Eo '/_next/static/chunks/[^"]+\.js' /tmp/share.html | sort -u > /tmp/chunks.txt
          mkdir -p /tmp/chunks
          i=0
          while read -r p; do
            i=$((i+1))
            curl -sS -L "https://datafa.st$p" -o "/tmp/chunks/$i.js"
          done < /tmp/chunks.txt
          echo "=== widget URL builders ==="
          grep -rhoE '.{0,500}(widgets/|/widgets|widgetType|widgetId|fontSize|NaNpx|iframe|embedCode).{0,900}' /tmp/chunks | head -n 220
